spring.application.name=booking

spring.datasource.url=jdbc:postgresql://localhost:5432/bookingdb
spring.datasource.username=booking
spring.datasource.password=booking
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/0.1-master.yaml

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

logging.level.org.springframework=INFO
logging.level.com.booking=DEBUG
logging.level.org.springframework.cache=DEBUG

server.port=8080
