databaseChangeLog:
  - changeSet:
      id: 2
      author: me
      changes:
        - createSequence:
            sequenceName: booking_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
              - column:
                  name: unit_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_booking_unit
                    references: units(id)
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_booking_user
                    references: users(id)
              - column:
                  name: start_date
                  type: date
              - column:
                  name: end_date
                  type: date
              - column:
                  name: status
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: expires_at
                  type: timestamp